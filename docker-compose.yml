version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tradex}
    ports:
      - "5432:5432"
    volumes:
      - tradex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tradex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradex_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/tradex
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tradex
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-tradex_super_secret_jwt_key_must_be_changed_in_production_at_least_32_chars}
      - INITIAL_PAPER_BALANCE=${INITIAL_PAPER_BALANCE:-100000.00}
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: tradex_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - tradex_uptime_kuma_data:/app/data

volumes:
  tradex_postgres_data:
  tradex_redis_data:
  tradex_uptime_kuma_data:
