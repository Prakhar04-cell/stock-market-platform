version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tradex}
    ports:
      - "5432:5432"
    volumes:
      - tradex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradex-net

  redis:
    image: redis:7-alpine
    container_name: tradex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tradex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradex_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tradex}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tradex}
      - REDIS_URL=redis://redis:6379/0
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - UPSTOX_CLIENT_ID=${UPSTOX_CLIENT_ID:-}
      - UPSTOX_CLIENT_SECRET=${UPSTOX_CLIENT_SECRET:-}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI:-}
      - JWT_SECRET=${JWT_SECRET:-tradex_super_secret_jwt_key_must_be_changed_in_production_at_least_32_chars}
      - INITIAL_PAPER_BALANCE=${INITIAL_PAPER_BALANCE:-100000.00}
      - ENVIRONMENT=development
      - DEBUG=true
      - JAVA_SERVICE_URL=http://java-service:8081
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
    networks:
      - tradex-net

  java-service:
    build:
      context: ./java-security-service
      dockerfile: Dockerfile
    container_name: tradex_java_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradex}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-tradex_super_secret_jwt_key_must_be_changed_in_production_at_least_32_chars}
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8081:8081"
    networks:
      - tradex-net

volumes:
  tradex_postgres_data:
  tradex_redis_data:

networks:
  tradex-net:
    driver: bridge
