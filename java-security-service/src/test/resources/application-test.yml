server:
  port: 8081

spring:
  application:
    name: bullrun-java-security-service-test
  datasource:
    url: jdbc:h2:mem:tradextest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

bullrun:
  security:
    jwt:
      secret: tradex_super_secret_jwt_key_must_be_changed_in_production_at_least_32_chars
      algorithm: HS256
    rate-limit:
      enabled: true
      general-requests-per-minute: 100
      security-requests-per-minute: 20
      analytics-requests-per-minute: 50
